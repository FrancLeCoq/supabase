# Déploie TOUTES les edge functions présentes dans supabase/functions/
# sur Supabase, depuis le cloud GitHub (aucun CLI local requis).
# La CLI Supabase compile depuis le disque = déploiement fiable.
#
# Fonctions concernées (celles versionnées dans ce repo) :
#   bot-handler, daily-crypto, daily-world, daily-hot,
#   daily-fact-dyk, daily-pump, daily-report
# (les autres fonctions non versionnées ici ne sont pas touchées.)
#
# Prérequis (déjà fait) : secret SUPABASE_ACCESS_TOKEN dans
#   Settings -> Secrets and variables -> Actions.
#
# Déclenchement : à chaque push touchant supabase/functions/**,
# ou manuellement via le bouton "Run workflow".
name: Deploy edge functions

on:
  push:
    branches: [claude/focused-hopper-9pj646]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer la CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Déployer toutes les fonctions du repo
        run: supabase functions deploy --project-ref mubqtnqulpyehkgubhnh --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
