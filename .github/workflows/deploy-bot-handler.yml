# Déploie la fonction bot-handler sur Supabase, depuis le cloud GitHub.
# Aucun PowerShell/CLI local requis : tout se déclenche depuis le navigateur
# (onglet Actions -> "Deploy bot-handler" -> bouton "Run workflow").
#
# Prérequis (une seule fois) : ajouter le secret SUPABASE_ACCESS_TOKEN
# dans Settings -> Secrets and variables -> Actions.
name: Deploy bot-handler

on:
  workflow_dispatch:   # bouton manuel "Run workflow" dans l'onglet Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer la CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Déployer bot-handler (compile depuis le disque = fiable)
        run: supabase functions deploy bot-handler --project-ref mubqtnqulpyehkgubhnh --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
